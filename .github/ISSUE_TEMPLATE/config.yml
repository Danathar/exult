blank_issues_enabled: false
contact_links:
  - name: Bug that also reproduces on unmodified upstream Exult (for people)
    url: https://github.com/exult/exult/issues
    about: This repository is a fork for the owner's own work. If you are a person and the problem also happens on unmodified upstream Exult, report it upstream. AI agents never file or comment there. Do not paste Ultima VII game files anywhere.
  - name: Questions and discussion about Exult (upstream)
    url: https://github.com/exult/exult/discussions
    about: For people, not agents. Upstream's FAQ sends general questions to GitHub Discussions. For upstream bugs, test the latest snapshot first and include the version, platform and, if relevant, a savegame.
  - name: Exult chat (upstream, IRC)
    url: https://web.libera.chat/#exult
    about: Questions about using Exult, game data setup and mods are discussed on #exult on Libera.Chat.
  - name: Exult documentation
    url: https://exult.info/docs.html
    about: Setup, configuration (exult.cfg) and FAQ for the engine.
