name: Auto issues

# When a gating workflow fails, times out or fails to start on a push to
# master, open one tracking issue for that workflow, or comment on it if it is
# already open. Until this file existed nothing told anyone that master had
# gone red.
#
# Which workflows: `CI` and `Coverage gate` (the required checks) and
# `ci-linux` (the upstream Linux build). The other upstream ci-* workflows
# (macOS, Windows, MSVC, Android, iOS, FreeBSD, OmniOS) are left out on
# purpose: they are slower and noisier, and a person watches them. The names
# are the `name:` of each workflow file; renaming one silently disconnects it
# from this list, and a name that matches no workflow simply never fires.
#
# Low-noise rules:
#   - One issue per workflow (exact title `<workflow> failing on master`),
#     never one per failure; later failures become comments on it.
#   - Label `ci-failure` (created on first use) marks these issues.
#   - Cap: with 5 or more open `ci-failure` issues, no new issue is opened;
#     the run says so in its summary and the existing ones must be dealt with
#     first. Comments on an already-open issue are still added.
#   - It never closes an issue. Recovery is a human's call.
#   - Only pushes to master count. Pull request runs of CI also complete with a
#     conclusion; a red PR is not a red master.
#
# Deliberately small:
#   - It never checks out or runs repository code and uses no third-party
#     action. The only thing it runs is `gh`, which is preinstalled.
#   - `workflow_run` always runs the copy of this file on the default branch,
#     so a pull request cannot change what it does.
# Issues are filed in this repository only (`GH_REPO` below), never in the
# upstream exult/exult. See AGENTS.md.

on:
  workflow_run:
    workflows: [CI, Coverage gate, ci-linux]
    types: [completed]
    branches: [master]

# Two failures of the same workflow arriving together must not both see "no
# issue yet" and each open one, so runs for one workflow are serialized. Never
# cancel a running one: a cancelled run is a failure nobody was told about.
# GitHub keeps only one pending run per group, so of several queued failures
# only the newest still adds its comment; the issue itself is never lost.
concurrency:
  group: auto-issues-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

# Write access is granted per job, not here.
permissions: {}

jobs:
  master-red:
    # A timed-out or never-started run leaves master unverified just as a red
    # one does. `cancelled` is not reported: a newer push superseding a run is normal.
    if: contains(fromJSON('["failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion) && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Event fields are attacker-influenced (a commit message is whatever
          # its author wrote), so they reach the shell only as env vars.
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          LABEL: ci-failure
          MAX_OPEN: '5'
        run: |
          set -euo pipefail
          TITLE="${WORKFLOW_NAME} failing on master"
          export TITLE
          subject=${COMMIT_MESSAGE%%$'\n'*}
          # Indented code block: whatever the subject contains stays text.
          # shellcheck disable=SC2016 # backticks in the template are literal Markdown
          body=$(printf 'The `%s` workflow ended with conclusion `%s` on a push to `master` on %s.\n\nCommit: %s\nRun: %s\n\nFirst line of the commit message:\n\n    %s\n\nThis issue is not closed automatically; close it once `master` is green again.\n' \
            "$WORKFLOW_NAME" "$CONCLUSION" "$(date -u +%Y-%m-%d)" "$HEAD_SHA" "$RUN_URL" "$subject")
          # List rather than search: the search index lags, and `in:title` is a
          # word match, not an exact one. Match the exact title AND the Actions
          # bot as author, so an issue anyone else opens with this title is
          # never the one a failure is reported into.
          existing=$(gh issue list --repo Danathar/exult --state open --limit 1000 --json number,title,author \
            --jq '[.[] | select(.title == env.TITLE and (.author.login == "app/github-actions" or .author.login == "github-actions[bot]" or .author.login == "github-actions"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo Danathar/exult --body "$body"
            exit 0
          fi
          open_count=$(gh issue list --repo Danathar/exult --state open --label "$LABEL" --limit 1000 --json number --jq length)
          if [ "$open_count" -ge "$MAX_OPEN" ]; then
            {
              echo "## Auto issues: cap reached"
              echo
              echo "$open_count open \`$LABEL\` issues (cap $MAX_OPEN); not opening a new one for \`$WORKFLOW_NAME\`."
              echo "Run: $RUN_URL"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$open_count open $LABEL issues; cap of $MAX_OPEN reached, no new issue opened."
            exit 0
          fi
          gh label create "$LABEL" --repo Danathar/exult --color d93f0b --description "Opened by Auto issues when a gating workflow fails on master" 2>/dev/null || true
          gh issue create --repo Danathar/exult --title "$TITLE" --body "$body" --label "$LABEL"
