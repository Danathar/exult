name: Mutation check

# Breaks each changed line of the product files the unit tests build in small
# ways (tests/mutate_changed.py), rebuilds and runs the unit tests after each,
# and fails when they pass on a break tests/mutation-equivalents.txt does not
# list. Pull requests only: it compares the head with the base branch. Changed
# files the unit build never sees are skipped, so most engine-only PRs finish
# after one baseline build.

on:
  pull_request:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation check (changed lines)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: mirror.gcr.io/library/debian:13
    defaults:
      run:
        shell: bash
    steps:
      - name: Install compiler, git and Python
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends g++ libc6-dev git python3 ca-certificates

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Test the mutation script
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -B -m unittest discover -s tests -p 'test_mutate_changed.py'

      - name: Mutate changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 -B tests/mutate_changed.py --base "origin/$BASE_REF" --jobs "$(nproc)" --budget-minutes 50
